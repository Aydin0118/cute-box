    -webkit-text-stroke: .5px #000;

  #menu.showClear .btn[data-q="clear"] { opacity: 1; pointer-events: auto; }
  .btn:hover { transform: translateY(-1px); }

  /* ---------- 中央主体 ---------- */
  #center { position: absolute; inset: 0; z-index: 10; }
  .obj {
    position: absolute; opacity: 0; pointer-events: none;
    transition: opacity .18s ease;

  .obj.on { opacity: 1; }

    display: flex; align-items: center; justify-content: center;
  }
  #youText {
    display: inline-block;
    font-family: "Arial Black", Impact, Arial, sans-serif;
    font-size: 152px; font-weight: 900; letter-spacing: 2px;
    color: #7a0d0f;
    -webkit-text-stroke: 2px #6a080a;
    text-shadow: 0 0 9px rgba(230,70,70,.55), 2px 2px 0 rgba(0,0,0,.16);
    transform: translate(-11px, 21px) scale(1.03, 1.21);
  }
  .shadow { filter: drop-shadow(4px 6px 4px rgba(0,0,0,.38)); }
  html.debug .obj, html.debug .btn, html.debug #menu { transition: none !important; }

  /* ---------- 确认对话框 ---------- */
  #overlay {
    position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.54);
    opacity: 0; pointer-events: none;
  }
  #dialog {
    position: absolute; left: 235px; top: 155px; width: 715px; height: 385px;
    background: #fff; border: 2px solid #2a2a2a; border-radius: 56px;

  #dlgTitle {

  .dlgBtn {

    color: #080808; cursor: pointer; pointer-events: auto;

    position: absolute; inset: 0; z-index: 25; background: #000;
    opacity: 0; pointer-events: none;
  }
  #pv { display: block; width: 1136px; height: 640px; opacity: 0; transition: opacity .15s linear; }
  html.debug #pv { transition: none; }

  /* ---------- 页面下方控制条（舞台之外） ---------- */
  #bar {
    width: 1136px; height: 46px; display: flex; align-items: center;
    justify-content: center; gap: 14px; color: #b9bbbe; font-size: 13px;

  #bar .tip { margin-right: 8px; letter-spacing: .3px; }
  #bar button {

    border-radius: 6px; padding: 6px 16px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  #bar button:hover { background: #3a3d42; }

const pv = document.getElementById('pv');
pv.src = PARTICLE_VIDEO;

/* ===== 像素心矩阵 ===== */
(function buildPixel() {
  const PIX = [
    "..BB..BB..",
    ".BRRBBRRB.",
    "BRRRRRRHRB",
    "BRRRRRRRRB",
    "BRRRRRRRRB",
    "BRRRRRRRRB",
    ".BRRRRRRB.",
    "..BRRRRB..",
    "...BRRB...",
    "....BB...."
  ];
  const color = { B: "#141414", R: "#b30c09", H: "#a08e8e" };
  let s = "";
  PIX.forEach(function (row, y) {
    for (let x = 0; x < row.length; x++) {
      const c = row[x];
      if (c === ".") continue;
      s += '<rect x="' + (x * 21) + '" y="' + (y * 21) + '" width="21" height="21" fill="' + color[c] + '"/>';
    }
  });
  document.getElementById('pixSvg').innerHTML = s;
})();

/* ===== 元素引用 ===== */
const menu = document.getElementById('menu');
const btns = Array.prototype.slice.call(document.querySelectorAll('.btn'));
const objs = Array.prototype.slice.call(document.querySelectorAll('.obj'));
const overlay = document.getElementById('overlay');
const dialog = document.getElementById('dialog');
const black = document.getElementById('black');
const heart = document.getElementById('oHeart');
const youEl = document.getElementById('oYou');
const btnPause = document.getElementById('btnPause');
const wrap = document.getElementById('wrap');

/* ===== 时间轴（默认静止，不自动播放） ===== */
const T_BLACK = 13.8;        // 黑底粒子视频起点
const VID_DUR = 4.6667;      // 视频时长（30fps / 140 帧）
const T_BLACK_END = 18.45;   // 视频播完，开始淡出
const T_END = 19.2;          // 淡出结束，停在 1080P 心形

let clock = 0, playing = false, last = performance.now();
let lastObj = "heart", lastShift = 14, videoActive = false;

function phaseAt(t) {
  if (t < 0.7)   return { q: "1080p", obj: "heart" };
  if (t < 1.6)   return { q: null,    obj: "fade" };
  if (t < 2.7)   return { q: "460p",  obj: "pixel" };
  if (t < 4.7)   return { q: "720p",  obj: "angular" };
  if (t < 7.5)   return { q: "1080p", obj: "heart" };
  if (t < 9.7)   return { q: "4k",    obj: "organ" };
  if (t < 12.7)  return { q: "8k",    obj: "you" };
  if (t < 13.85) return { q: "8k",    obj: "you", dlg: true };
  if (t < T_END) return { black: true };
  return { q: "1080p", obj: "heart" };
}

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function smooth(p) { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); }

/* 视频里左侧菜单会随时间左右移动：开头/结尾靠右，中段靠左 */
function menuShiftAt(t) {
  if (t < 0.7) return 14;
  if (t < 1.7) return 14 - 49 * smooth((t - 0.7) / 1.0);
  if (t < 18.4) return -35;
  if (t < T_END) return -35 + 49 * smooth((t - 18.4) / 0.8);
  return 14;
}

function render(t) {
  const p = phaseAt(t);
  const inK = smooth((t - 12.7) / 0.25);
  const outK = smooth((t - 13.42) / 0.22);

  /* 清晰度按钮与菜单位移 */
  const shift = menuShiftAt(t);
  if (Math.abs(shift - lastShift) > 0.4 || lastShift === null) {
    menu.style.transform = "translateX(" + shift + "px)";
    lastShift = shift;
  }
  btns.forEach(function (b) { b.classList.toggle("active", b.dataset.q === p.q); });
  menu.classList.toggle("showClear", t >= 11.0 && t < 13.85);

  /* 中央主体 */
  const name = (p.obj === "fade") ? "heart" : (p.black ? "" : p.obj);
  if (name !== lastObj) {
    objs.forEach(function (o) { o.classList.toggle("on", o.dataset.name === name); });
    lastObj = name;
  }
  if (p.obj === "fade") {
    const k = clamp((t - 0.7) / 0.9, 0, 1);
    heart.style.opacity = String(1 - k * 0.94);
    heart.style.filter = "blur(" + (k * 13) + "px)";
  } else {
    heart.style.opacity = "";
    heart.style.filter = "";
  }
  youEl.style.opacity = p.dlg ? String(1 - inK) : "";

  /* 对话框：淡入 → 放大淡出，与黑底淡入交叉 */
  let ov = 0, ds = 0.86, dop = 0;
  if (p.dlg) {
    ov = inK * (1 - outK);
    ds = 0.86 + 0.14 * inK + 0.60 * outK;
    dop = inK * (1 - outK);
  }
  overlay.style.opacity = String(ov);
  overlay.style.pointerEvents = dop > 0.5 ? "auto" : "none";
  dialog.style.opacity = String(dop);
  dialog.style.transform = "scale(" + ds + ")";
  dialog.style.pointerEvents = dop > 0.5 ? "auto" : "none";

  /* 黑底：0.2s 淡入 → 完整播放 → 0.75s 淡出 */
  let bo = 0;
  if (t >= 13.6 && t < T_BLACK) bo = smooth((t - 13.6) / 0.2);
  else if (t >= T_BLACK && t < T_BLACK_END) bo = 1;
  else if (t >= T_BLACK_END && t < T_END) bo = 1 - smooth((t - T_BLACK_END) / 0.75);
  black.style.opacity = String(bo);
  /* 粒子只在黑场铺好后出现，避免与对话框残影叠在一起 */
  pv.style.opacity = (t >= T_BLACK && t < T_END) ? "1" : "0";

  /* 静止状态下定位视频画面（便于 ?t= 对照与暂停时定格） */
  if (!playing && t >= T_BLACK && t < T_END && pv.readyState >= 1) {
    const target = clamp(t - T_BLACK, 0, VID_DUR - 0.03);
    if (Math.abs(pv.currentTime - target) > 0.04) {
      try { pv.currentTime = target; } catch (e) {}
    }
  }
}

/* ===== 播放控制：视频主导时间轴，保证 30fps 完全同步 ===== */
function syncBtns() { btnPause.textContent = playing ? "暂停" : "播放"; }

function setPlaying(v) {
  playing = v;
  if (!playing && !pv.paused) pv.pause();
  if (playing && videoActive && pv.paused && !pv.ended) {
    const pr = pv.play(); if (pr && pr.catch) pr.catch(function () {});
  }
  syncBtns();
}

function seek(t, play) {
  clock = t;
  videoActive = false;
  pv.pause();
  setPlaying(!!play);
}

function startVideo() {
  videoActive = true;
  try {
    pv.currentTime = clamp(clock - T_BLACK, 0, VID_DUR - 0.03);
    const pr = pv.play();
    if (pr && pr.catch) pr.catch(function () { videoActive = false; });
  } catch (e) { videoActive = false; }
}

pv.addEventListener('ended', function () {
  videoActive = false;
  if (playing) clock = T_BLACK_END;   // 交给时间轴做淡出收尾
});

function tick(now) {
  const dt = Math.min(now - last, 60);
  last = now;
  if (playing) {
    if (videoActive) {
      if (pv.ended) { videoActive = false; clock = T_BLACK_END; }
      else if (!pv.paused) clock = T_BLACK + pv.currentTime;
    } else {
      clock += dt / 1000;
      if (clock >= T_BLACK && clock < T_BLACK_END) startVideo();
    }
    if (clock >= T_END) { clock = T_END; setPlaying(false); }
  }
  render(clock);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ===== 交互 ===== */
const seekMap = { "460p": 2.1, "720p": 3.6, "1080p": 6.0, "4k": 8.6, "8k": 11.2, "clear": 13.0 };
btns.forEach(function (b) {
  b.addEventListener("click", function () { seek(seekMap[b.dataset.q], false); });
});
/* 「确定」：先让对话框放大淡出，再交叉进入流畅的黑底动画 */
document.getElementById('dlgOk').addEventListener("click", function () { seek(13.5, true); });
document.getElementById('dlgNo').addEventListener("click", function () { seek(11.2, false); });
document.getElementById('btnReplay').addEventListener("click", function () { seek(0, true); });
btnPause.addEventListener("click", function () { setPlaying(!playing); });
document.addEventListener("keydown", function (e) {
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  if (e.key === "r" || e.key === "R") seek(0, true);
});

/* ===== 自适应缩放 ===== */
function fit() {
  const  = Math.min(window.innerWidth / 1160, (window.innerHeight - 24) / 686);
  wrap.style.transform = "scale(" + Math.max(0.3, Math.min(, 2.2)) + ")";
}
window.addEventListener("resize", fit);
fit();
syncBtns();

/* 支持 ?t=秒数 直接定位到某一帧（便于对照与分享） */
(function () {
  const m = /[?&]t=([\d.]+)/.exec(location.search);
  if (m) { document.documentElement.classList.add("debug"); seek(parseFloat(m[1]), false); }
})();
</script>
